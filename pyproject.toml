[project]
name = "datum"
version = "0.0.1"
description = "The event envelope: a versioned payload schema for physical control surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "click>=8.1",
]

[project.scripts]
datum = "datum.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Both outside the blessed house-stack set, both carrying a record, both
    # imported lazily so the runtime package loads without them.
    # governance/qm/adr/DRAFT-json-schema-validator-for-the-conformance-gate.md
    "jsonschema>=4.21",
    # governance/qm/adr/DRAFT-mqtt-client-for-the-wire-harness.md
    "paho-mqtt>=2.1",
]

# What `datum preflight` needs to run the workflows the way CI does. The
# workflows install their own tools with `python -m pip install ...`, and a
# uv-managed environment has no pip, so those steps fail for an environment
# reason rather than a real one. Mirrors governance/qm's own `preflight` extra.
#
#     uv sync --group preflight
preflight = [
    "pip",
    "pyyaml>=6.0",
    # The extra, not bare `reuse`: without it the package wants libmagic at
    # import time and dies before it lints anything. A Windows box has no
    # libmagic; the runner image does.
    "reuse[charset-normalizer]>=3.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema/src/datum"]

# The documentation IS the test suite. Everything pytest collects here is prose
# with executable examples in it: the walkthrough, and the docstrings that explain
# the contract at the point of use. A claim that stops being true fails the
# build rather than going stale. There is nowhere to write an untested example.
[tool.pytest.ini_options]
addopts = "--doctest-glob=*.md --doctest-modules -q"
testpaths = ["README.md", "walkthrough", "schema/src/datum"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
