[project]
name = "tessera"
version = "0.1.0"
description = "The event envelope: a versioned payload schema for physical control surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "click>=8.1",
]

[project.scripts]
tessera = "tessera.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Outside the blessed house-stack set. Pending
    # governance/qm/adr/DRAFT-json-schema-validator-for-the-conformance-gate.md.
    "jsonschema>=4.21",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema/src/tessera"]

# The documentation IS the test suite. Everything pytest collects here is prose
# with executable examples in it: the cookbook, and the docstrings that explain
# the contract at the point of use. A claim that stops being true fails the
# build rather than going stale. There is nowhere to write an untested example.
[tool.pytest.ini_options]
addopts = "--doctest-glob=*.md --doctest-modules -q"
testpaths = ["README.md", "schema/src/tessera"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
